<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>作曲支援ツール - ETERNAL TRUTH</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>作曲支援ツール ETERNAL TRUTH</h1>
    <div class="controls">
      <button class="toggle-btn" id="toggleFretboard">指板 非表示</button>
    </div>
  </header>

  <div class="container">

    <div class="section">
      <div class="selector">
        <select id="scaleType">
          <option value="major">メジャー</option>
          <option value="minor-natural">マイナー（自然短調）</option>
          <option value="minor-harmonic">マイナー（和声短調）</option>
          <option value="minor-melodic">マイナー（旋律短調）</option>
        </select>
        <select id="rootNote">
          <option value="C">C</option><option value="D">D</option><option value="E">E</option>
          <option value="F">F</option><option value="G">G</option><option value="A">A</option><option value="B">B</option>
        </select>
      </div>
    </div>

    <div class="section">
      <h3>ダイアトニックコード</h3>
      <div class="tabs">
        <button class="tab active" data-tab="triad">3和音</button>
        <button class="tab" data-tab="seventh">7thコード</button>
      </div>
      <div class="chord-grid" id="diatonicChords"></div>
    </div>

    <div class="section">
      <h3>非ダイアトニックコード</h3>
      <div class="non-diatonic-groups" id="nonDiatonicGroups"></div>
    </div>

  </div>

<div class="fixed-fretboard" id="fixedFretboard">
  <div class="controls">
    <button class="avoid-btn" id="avoidToggle">アボイド除外</button>
  </div>
  <div class="fretboard-wrapper">
    <div class="fretboard-mini" id="miniFretboard">
      <div class="fret-number-mini" id="fretNumbersMini"></div>
    </div>
  </div>
  <div class="mini-label" id="miniLabel">コードをクリック → 指板に構成音が表示されます</div>
</div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
</body>
</html>
